name: verification

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends yosys make g++
          pip install -r requirements.txt
          echo "$(python -c 'import verilator, os; print(os.path.join(os.path.dirname(verilator.__file__), "bin"))')" >> "$GITHUB_PATH"
      - name: Lint
        run: make lint
      - name: Regression (quick) with functional coverage
        run: python scripts/regress.py --quick
      - name: Self test simulation
        run: python scripts/run_bist.py
      - name: Bug injection
        run: python scripts/bug_campaign.py
      - name: Formal proofs
        run: make formal
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            docs/coverage_report.md
            docs/bug_injection_results.md
